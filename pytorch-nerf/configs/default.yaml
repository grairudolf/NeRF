# Configuration settings for the NeRF project
model:
  type: "NeRF"
  num_layers: 8
  num_units: 256
  activation: "relu"

dataset:
  path: "path/to/dataset"
  image_size: [800, 800]
  num_images: 100
  camera_intrinsics: 
    fx: 800
    fy: 800
    cx: 400
    cy: 400

training:
  num_epochs: 1000
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  photometric_loss: "mse"

rendering:
  num_samples_per_ray: 64
  num_importance_samples: 128
  stratified_sampling: true
  hierarchical_sampling: true

output:
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"
  render_dir: "renders/"