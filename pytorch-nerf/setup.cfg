[metadata]
name = pytorch-nerf
version = 0.1.0
description = A PyTorch implementation of Neural Radiance Fields (NeRF) for 3D scene reconstruction from 2D images.
author = Your Name
author_email = your.email@example.com
url = https://github.com/yourusername/pytorch-nerf
license = MIT

[options]
packages = find:
install_requires =
    torch>=1.7.0
    numpy>=1.19.0
    matplotlib>=3.3.0
    pyyaml>=5.3.0

[options.packages.find]
where = src